plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viet.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.viet.keyboard"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Hỗ trợ các kiến trúc CPU phổ biến
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            v1SigningEnabled true
            v2SigningEnabled true
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            } else if (rootProject.file("keystore.properties").exists()) {
                def props = new Properties()
                props.load(new FileInputStream(rootProject.file("keystore.properties")))
                storeFile file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            } else {
                // Tự động dùng debug keystore để APK luôn có chữ ký v1+v2 cài được ngay
                initWith debug
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Luôn có signing config để APK hợp lệ trên Android 9+
            signingConfig signingConfigs.release
        }
    }

    // Bật APK Signature Scheme v2 (bắt buộc cho Android 7.0+)
    // v1 + v2 signing để tương thích tất cả phiên bản
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Tên file APK output
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "BanPhimViet-${variant.buildType.name}-v${defaultConfig.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    testImplementation 'junit:junit:4.13.2'
}
