name: Build Vietnamese Keyboard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Tải gradle-wrapper.jar nếu chưa có trong repo
      - name: Download gradle-wrapper.jar if missing
        run: |
          JAR=gradle/wrapper/gradle-wrapper.jar
          if [ ! -f "$JAR" ] || [ "$(wc -c < "$JAR")" -lt 10000 ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR"
            echo "Downloaded: $(wc -c < "$JAR") bytes"
          else
            echo "gradle-wrapper.jar already present ($(wc -c < "$JAR") bytes)"
          fi

      # 4. Cấp quyền thực thi cho gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6. Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BanPhimViet-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 7b. Kiểm tra xem có Secrets để ký không
      - name: Check signing secrets
        id: check_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      # 8. Build Release APK (unsigned)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 9. Ký Release APK (chỉ chạy khi có Secrets)
      - name: Sign Release APK
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # 10. Upload Release APK đã ký
      - name: Upload Signed Release APK
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BanPhimViet-release-signed-${{ github.run_number }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 90

      # 10b. Upload Release APK (khi chưa có Secrets - đã được ký bằng debug keystore tự động)
      - name: Upload Release APK
        if: steps.check_secrets.outputs.has_keystore == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: BanPhimViet-release-v1.3-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 11. Tạo GitHub Release khi push tag v*.*.*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          name: "Bàn Phím Việt ${{ github.ref_name }}"
          body: |
            ## 📲 Bàn Phím Tiếng Việt ${{ github.ref_name }}

            ### Cách cài đặt:
            1. Tải file APK bên dưới
            2. Bật "Cài từ nguồn không rõ" trên điện thoại
            3. Mở file APK và cài đặt
            4. Làm theo hướng dẫn trong app

            ### Tính năng:
            - 🇻🇳 Đầy đủ 29 chữ cái tiếng Việt
            - 🎵 6 dấu thanh: sắc, huyền, ngã, hỏi, nặng, ngang
            - 🔢 Dãy số tắt/hiện được
            - 😊 Bộ emoji dễ thương 7 danh mục
            - 🌙 Giao diện tối hiện đại
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
